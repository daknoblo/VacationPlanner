{{define "ideas_map"}}
<section class="panel ideas-map-panel" data-ideas-map-panel
         data-map-url="/vacations/{{.ID}}/api/ideas-map"
         data-overview="{{t "ideas.map.overview"}}" data-no-geometry="{{t "ideas.map.no_geometry"}}"
         data-loading="{{t "ideas.map.loading"}}" data-error="{{t "ideas.map.error"}}"
         data-missing="{{t "ideas.map.missing"}}" data-no-origin="{{t "ideas.map.no_origin"}}"
         data-location-warning="{{t "ideas.location.warning"}}"
         data-focus-route="{{t "ideas.map.focus_route"}}"
         data-route-from="{{t "ideas.map.from"}}"
         data-schedule="{{t "ideas.map.schedule"}}" data-unscheduled="{{t "ideas.map.unscheduled"}}"
         data-schedule-error="{{t "ideas.map.schedule_error"}}" data-saving="{{t "ideas.map.saving"}}"
         data-description-pending="{{t "ideas.map.description_pending"}}"
         data-description-unavailable="{{t "ideas.map.description_unavailable"}}"
         data-description-ai="{{t "ideas.map.description_ai"}}"
         data-pending="{{t "ideas.map.pending"}}" data-unavailable="{{t "ideas.map.unavailable"}}"
         data-disabled="{{t "ideas.map.disabled"}}" data-ready="{{t "ideas.map.ready"}}"
         data-demo="{{t "ideas.map.demo"}}" data-choose="{{t "ideas.map.choose"}}"
         data-removed="{{t "ideas.map.removed"}}" data-no-ideas="{{t "ideas.map.empty"}}">
  <div class="ideas-map-heading">
    <h2>{{t "ideas.map.title"}}</h2>
    <span class="muted small" role="status" data-ideas-map-cache-status></span>
  </div>
  <p class="muted small">{{t "ideas.map.hint"}}</p>
  <div class="ideas-map-controls">
      <label for="ideas-map-origin">{{t "ideas.map.origin"}}</label>
      <select id="ideas-map-origin" data-ideas-map-origin disabled><option value="">{{t "ideas.map.choose"}}</option></select>
  </div>
  <p class="muted small">{{t "ideas.map.legend"}}</p>
  <p class="muted small" role="status" data-ideas-map-status>{{t "ideas.map.loading"}}</p>
  <div id="ideas-map" class="ideas-map" aria-label="{{t "ideas.map.title"}}"></div>
  <div class="ideas-map-table">
    <table>
      <thead><tr>
        <th scope="col">{{t "ideas.map.idea"}}</th>
        <th scope="col" aria-sort="none"><button type="button" class="ideas-map-sort" data-ideas-sort="distanceM">{{t "ideas.map.distance"}} <span aria-hidden="true">↕</span></button></th>
        <th scope="col" aria-sort="none"><button type="button" class="ideas-map-sort" data-ideas-sort="durationS">{{t "ideas.map.duration"}} <span aria-hidden="true">↕</span></button></th>
        <th scope="col">{{t "ideas.map.schedule"}}</th>
      </tr></thead>
      <tbody data-ideas-map-rows></tbody>
    </table>
  </div>
</section>
{{end}}
